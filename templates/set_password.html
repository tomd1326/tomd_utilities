{% extends 'base.html' %}
{% block title %}Set Password — Expenditure{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-key text-primary" style="font-size:2.5rem"></i>
          <h4 class="mt-2 mb-0">Set Your Password</h4>
          <p class="text-muted small">Choose a password to secure your account.</p>
        </div>
<form method="post" autocomplete="off">
          <div class="mb-3">
            <label class="form-label fw-medium">New password</label>
            <input name="new_password" type="password" class="form-control" minlength="8" autofocus required>
            <div class="form-text">Minimum 8 characters.</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-medium">Confirm password</label>
            <input name="confirm" type="password" class="form-control" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Set Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
