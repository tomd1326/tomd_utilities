{% extends 'base.html' %}
{% block title %}Change Password — Expenditure{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-key me-2 text-primary"></i>Change Password</h4>

<div class="row">
  <div class="col-sm-8 col-md-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Current password</label>
            <input type="password" name="current" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">New password</label>
            <input type="password" name="new_password" class="form-control" required minlength="8">
            <div class="form-text">Minimum 8 characters.</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm new password</label>
            <input type="password" name="confirm" class="form-control" required minlength="8">
          </div>
          <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
