{% extends 'base.html' %}
{% block title %}Login — Expenditure{% endblock %}

{% block content_unauth %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-wallet2 text-primary" style="font-size:2.5rem"></i>
          <h4 class="mt-2 mb-0">Expenditure Tracker</h4>
          <p class="text-muted small">Sign in to continue</p>
        </div>
        <form method="post" autocomplete="off">
          <div class="mb-3">
            <label class="form-label fw-medium">Username</label>
            <input name="username" type="text" class="form-control" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-medium">Password</label>
            <input name="password" type="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content_unauth %}
